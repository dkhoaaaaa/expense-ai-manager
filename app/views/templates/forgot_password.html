<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quên mật khẩu - Quản Lý Chi Tiêu AI</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
    </head>
    <body>
        <div id="container">
            <div class="login">
                <div class="content">
                    <h1>Quên mật khẩu</h1>
                    <p style="color: #666; font-size: 14px; margin-bottom: 20px; line-height: 1.5;">Nhập Email hoặc Số điện thoại của bạn. Chúng tôi sẽ gửi hướng dẫn để khôi phục mật khẩu.</p>

                    {% if message %}
                        <span class="auth-message" style="margin-bottom: 15px; display: block;">{{ message }}</span>
                    {% endif %}

                    <form method="post" action="{{ url_for('demo.forgot_password') }}">
                        <input type="text" name="email" placeholder="Email hoặc Số điện thoại" autocomplete="username" required />
                        <span class="clearfix"></span>
                        <button type="submit">Gửi yêu cầu</button>
                    </form>
                    <div style="margin-top: 20px; text-align: center;">
                        <a href="{{ url_for('demo.login_page') }}" style="color: #4CAF50; font-weight: bold; text-decoration: none;">← Quay lại đăng nhập</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
