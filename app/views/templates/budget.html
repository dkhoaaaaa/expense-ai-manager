<!DOCTYPE html>
<html>
<head>
    <title>Budget</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>💰 Budget Manager</h2>

    <!-- FORM -->
    <div class="card p-3 mt-3">

        <input id="month" class="form-control mb-2" placeholder="Month (1-12)">
        <input id="year" class="form-control mb-2" placeholder="Year">
        <input id="amount" class="form-control mb-2" placeholder="Budget Amount">

        <button class="btn btn-success" onclick="save()">Save Budget</button>

    </div>

    <!-- STATUS -->
    <div class="mt-4" id="status"></div>

</div>

<script>

async function save() {
    await fetch("/api/budget", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            month: document.getElementById("month").value,
            year: document.getElementById("year").value,
            amount: document.getElementById("amount").value
        })
    });

    alert("Saved!");
    loadStatus();
}

async function loadStatus() {
    const month = new Date().getMonth() + 1;
    const year = new Date().getFullYear();

    const res = await fetch(`/api/budget/status?month=${month}&year=${year}`);
    const data = await res.json();

    document.getElementById("status").innerHTML = `
        <div class="card p-3">
            <h5>Budget Status</h5>
            <p>Budget: ${data.budget}</p>
            <p>Spent: ${data.spent}</p>
            <p>Remaining: ${data.remaining}</p>
            <p class="text-danger"><b>${data.warning || "OK"}</b></p>
        </div>
    `;
}

loadStatus();

</script>

</body>
</html>
