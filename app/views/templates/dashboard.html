<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>📊 Financial Dashboard</h2>

    <!-- SUMMARY CARDS -->
    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card p-3 bg-success text-white">
                <h5>Total Income</h5>
                <h3 id="income">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-danger text-white">
                <h5>Total Expense</h5>
                <h3 id="expense">0</h3>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 bg-primary text-white">
                <h5>Balance</h5>
                <h3 id="balance">0</h3>
            </div>
        </div>

    </div>

    <!-- CHARTS -->
    <div class="row mt-5">

        <div class="col-md-6">
            <canvas id="pieChart"></canvas>
        </div>

        <div class="col-md-6">
            <canvas id="barChart"></canvas>
        </div>

    </div>

    <!-- BUDGET WARNING -->
    <div class="mt-4" id="budgetWarning"></div>

</div>

<script>
async function loadDashboard() {
    const res = await fetch("/api/dashboard");
    const data = await res.json();

    document.getElementById("income").innerText = data.income;
    document.getElementById("expense").innerText = data.expense;
    document.getElementById("balance").innerText = data.balance;

    // PIE CHART
    const ctx1 = document.getElementById('pieChart');
    new Chart(ctx1, {
        type: 'pie',
        data: {
            labels: Object.keys(data.category_stats),
            datasets: [{
                data: Object.values(data.category_stats)
            }]
        }
    });

    // BAR CHART (demo same data)
    const ctx2 = document.getElementById('barChart');
    new Chart(ctx2, {
        type: 'bar',
        data: {
            labels: Object.keys(data.category_stats),
            datasets: [{
                label: "Expenses by Category",
                data: Object.values(data.category_stats)
            }]
        }
    });
}

loadDashboard();
</script>

</body>
</html>
