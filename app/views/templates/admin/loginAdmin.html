<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin/adminLogin.css') }}">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <h1 class="login-title">Admin Login</h1>
            <p class="login-subtitle">
                Đăng nhập để truy cập hệ thống quản trị
            </p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">
                    Tài khoản
                </label>
                <input
                    type="text"
                    id="email"
                    class="form-control"
                    placeholder="Nhập tài khoản"
                    required
                >
            </div>
            <div class="mb-4">
                <label class="form-label">
                    Mật khẩu
                </label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Nhập mật khẩu"
                    required
                >
            </div>
            <button type="submit" class="btn btn-login w-100 text-white">
                Đăng nhập
            </button>
        </form>
    </div>
    
    <div id="toastContainer" class="toast-container-custom"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin/adminCommon.js') }}"></script>
    <script src="{{ url_for('static', filename='js/admin/adminLogin.js') }}"></script>

</body>
</html>
