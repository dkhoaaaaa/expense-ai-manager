<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Expense Manager AI</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/demo.css') }}">
</head>

<body>

<div class="container mt-5">
    <div class="card shadow p-4">

        <h3 class="text-center mb-4">💸 Expense Manager AI</h3>

        <div class="mb-3">
            <label class="form-label">Số tiền</label>
            <input type="number" id="amount" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <input type="text" id="description" class="form-control" placeholder="vd: ăn bún bò">
        </div>

        <div class="d-grid gap-2">
            <button class="btn btn-primary" onclick="addTransaction()">➕ Thêm giao dịch</button>
            <button class="btn btn-success" onclick="predictExpense()">📈 Dự đoán</button>
        </div>

        <div id="result" class="alert alert-info mt-4 d-none"></div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/demo.js') }}"></script>

</body>
</html>
