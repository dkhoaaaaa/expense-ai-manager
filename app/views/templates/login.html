<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản Lý Chi Tiêu AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="logo-box mx-auto mb-3">
                    <i class="bi bi-wallet2"></i>
                </div>
                <h3 class="fw-bold">Chào mừng trở lại!</h3>
                <p class="text-muted">Đăng nhập để quản lý chi tiêu của bạn</p>
            </div>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control form-control-lg" placeholder="Nhập email của bạn" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu" required>
                    <div class="text-end mt-2">
                        <a href="#" class="text-success text-decoration-none small fw-semibold">Quên mật khẩu?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-main w-100 btn-lg mb-3">Đăng nhập</button>
            </form>
            <div class="text-center">
                <span class="text-muted">Chưa có tài khoản?</span> 
                <a href="/register" class="text-success fw-bold text-decoration-none">Đăng ký ngay</a>
            </div>
        </div>
    </div>
</body>
</html>
