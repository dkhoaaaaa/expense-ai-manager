<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Đăng nhập - Quản Lý Chi Tiêu AI</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
    </head>
    <body>
        <div id="container" class="{{ 'active' if mode == 'register' else 'close' }}">
            <div class="login">
                <div class="content">
                    <h1>Đăng nhập</h1>

                    {% if message %}
                        <span class="auth-message">{{ message }}</span>
                    {% endif %}

                    <form method="post" action="{{ url_for('demo.login_page') }}">
                        <input type="text" name="email" placeholder="Nhập Email hoặc Số điện thoại" autocomplete="username" required />
                        <input type="password" name="password" placeholder="Mật khẩu" autocomplete="current-password" required />
                        <span class="remember">
                            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;"><input type="checkbox" name="remember" style="width: auto; margin-bottom: 0; cursor: pointer;" /> Ghi nhớ tôi</label>
                        </span>
                        <span class="forget"><a href="{{ url_for('demo.forgot_password') }}">Quên mật khẩu?</a></span>
                        <span class="clearfix"></span>
                        <button type="submit">Đăng nhập</button>
                    </form>
                </div>
            </div>

            <div class="register">
                <div class="content">
                    <h1>Đăng ký</h1>
                    <form method="post" action="{{ url_for('demo.register_page') }}">
                        <input type="text" name="fullname" placeholder="Họ và tên" autocomplete="name" required />
                        <input type="text" name="register_email" placeholder="Email hoặc Số điện thoại" autocomplete="username" required />
                        <input type="password" name="register_password" placeholder="Mật khẩu" autocomplete="new-password" required />
                        <button type="submit">Đăng ký</button>
                    </form>
                </div>
            </div>

            <div class="page front">
                <div class="content">
                    <h1>Xin chào!</h1>
                    <p>Đăng ký tài khoản để bắt đầu quản lý chi tiêu và nhận gợi ý AI.</p>
                    <button id="register" type="button">Đăng ký</button>
                </div>
            </div>

            <div class="page back">
                <div class="content">
                    <h1>Chào mừng quay lại!</h1>
                    <p>Đăng nhập để tiếp tục theo dõi giao dịch và số dư của bạn.</p>
                    <button id="login" type="button">Đăng nhập</button>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', filename='js/auth.js') }}?v=3" defer></script>
    </body>
</html>
