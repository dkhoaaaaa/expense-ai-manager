<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - Quản Lý Chi Tiêu AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="bg-light">

    <!-- Hiển thị thông báo -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="container mt-4 position-fixed top-0 start-50 translate-middle-x" style="z-index: 9999; max-width: 500px;">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
              <strong>Thông báo: </strong> {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="logo-box mx-auto mb-3">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3 class="fw-bold">Tạo mật khẩu mới</h3>
                <p class="text-muted">Vui lòng thiết lập mật khẩu mới cho tài khoản của bạn</p>
            </div>
            <form action="/reset-password/{{ token }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Mật khẩu mới</label>
                    <input type="password" name="new_password" class="form-control form-control-lg" placeholder="Nhập ít nhất 6 ký tự" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                    <input type="password" name="confirm_password" class="form-control form-control-lg" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-main w-100 btn-lg mb-3">Lưu mật khẩu mới</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
