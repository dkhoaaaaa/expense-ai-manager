<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Khôi phục mật khẩu - Quản Lý Chi Tiêu AI</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
    </head>
    <body>
        <div id="container">
            <div class="login">
                <div class="content">
                    <h1>Đổi mật khẩu</h1>
                    <p style="color: #666; font-size: 14px; margin-bottom: 10px; line-height: 1.5;">Mã OTP đã được gửi đến: <strong>{{ email }}</strong></p>
                    <p style="color: #4CAF50; font-size: 14px; margin-bottom: 20px;">(Vì chưa kết nối Email thật, mã OTP của bạn là: <strong>{{ otp }}</strong>)</p>

                    {% if message %}
                        <span class="auth-message" style="margin-bottom: 15px; display: block; color: red; font-weight: bold;">{{ message }}</span>
                    {% endif %}

                    <form method="post" action="{{ url_for('demo.reset_password') }}">
                        <input type="text" name="otp" placeholder="Nhập mã OTP (6 số)" autocomplete="off" required />
                        <input type="password" name="new_password" placeholder="Nhập mật khẩu mới" autocomplete="new-password" required />
                        <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required />
                        <span class="clearfix"></span>
                        <button type="submit">Xác nhận đổi mật khẩu</button>
                    </form>
                    <div style="margin-top: 20px; text-align: center;">
                        <a href="{{ url_for('demo.home') }}" style="color: #4CAF50; font-weight: bold; text-decoration: none;">← Quay lại trang chủ</a>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
